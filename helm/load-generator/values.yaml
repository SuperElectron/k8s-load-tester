replicaCount: 1

image:
  repository: superelectron/kubernetes-load-generator
  tag: latest
  pullPolicy: Always

service:
  port: 8080

env:
  # Leave apiUrl empty to target apiService inside this release's own namespace.
  # Set it to a full URL to aim the generator at an external target instead.
  apiUrl: ""
  apiService: api-golang
  apiPort: 8080
  delayMs: "100"

configMap:
  name: load-generator-config

resources:
  limits:
    memory: "50Mi"
  requests:
    memory: "50Mi"
    cpu: "100m"

imagePullSecret: dockerconfigjson
